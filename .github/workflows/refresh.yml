name: Refresh market data

on:
  schedule:
    # 09:00 UTC is 10:00 CET, Monday through Friday.
    - cron: "0 9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Append scraped prints
        id: append
        continue-on-error: true
        env:
          MISC_PASSPHRASE: ${{ secrets.MISC_PASSPHRASE }}
        run: node scripts/append-data.mjs

      - name: Commit appended prints
        id: commit
        if: steps.append.outcome == 'success' || steps.append.outcome == 'failure'
        run: |
          if git diff --quiet -- data; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add -- data
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Append the latest market prints."
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main

      - name: Report scrape failures
        if: steps.append.outcome == 'failure'
        run: exit 1
